name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-vet-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l cmd internal pkg)" || (gofmt -d cmd internal pkg && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go build
        run: go build ./...
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentledger/proxy:ci
